<form [formGroup]="form" (ngSubmit)="enviar()">
  <label class="form label">Ra</label>
  <input type="number" class="form-control" formControlName="ra">
  <div *ngIf="form.get('ra')?.invalid && (form.get('ra')?.dirty || form.get('ra')?.touched)">
    <div class="error" *ngIf="form.get('ra')?.errors?.['required']">RA é obrigatório!</div>
    <div class="error" *ngIf="form.get('ra')?.errors?.['minlength']">RA deve ter no mínimo 5 dígitos.</div>
    <div class="error" *ngIf="form.get('ra')?.errors?.['maxlength']">RA deve ter no máximo 10 dígitos.</div>
  </div>

  <label class="form label">Nome</label>
  <input type="text" class="form-control" formControlName="nome">
  <div *ngIf="form.get('nome')?.invalid && (form.get('nome')?.dirty || form.get('nome')?.touched)">
    <div class="error" *ngIf="form.get('nome')?.errors?.['required']">Nome é obrigatório!</div>
  </div>

  <label class="form label">Cursos</label>
  <select class="form-select" id="curso" formControlName="curso">
    <option *ngFor="let curso of cursos" [value]="curso"> {{curso }} </option>
  </select>
  <div *ngIf="form.get('curso')?.invalid && (form.get('curso')?.dirty || form.get('curso')?.touched)">
    <div class="error" *ngIf="form.get('curso')?.errors?.['required']">RA é obrigatório!</div>
  </div>

  <label class="form label">Data da matrícula</label>
  <input type="date" class="form-control" formControlName="dataMatricula">

  <label class="form label">Valor da Mensalidade</label>
  <input type="number" class="form-control" formControlName="valorMensalidade">
  <div *ngIf="form.get('valorMensalidade')?.invalid && (form.get('valorMensalidade')?.dirty || form.get('valorMensalidade')?.touched)">
    <div class="error" *ngIf="form.get('valorMensalidade')?.errors?.['required']">Valor é obrigatório</div>
    <div class="error" *ngIf="form.get('valorMensalidade')?.errors?.['pattern']">Digite um valor Válido!</div>

  </div>
  <div>
    <button type="submit" [disabled]="!form.valid" class="btn btn-primary">Enviar</button>
  </div>


</form>
